<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CaldTech Solutions - Selected Logo Options (2 & 3)</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    margin-bottom: 10px;
    font-size: 24px;
    color: #38bdf8;
    text-align: center;
  }
  p {
    color: #94a3b8;
    margin-bottom: 40px;
    font-size: 14px;
    text-align: center;
  }
  .logo-gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 30px;
    justify-content: center;
    max-width: 900px;
  }
  .logo-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .logo-card h3 {
    font-size: 15px;
    margin-bottom: 15px;
    color: #e2e8f0;
  }
  .svg-container {
    background: #ffffff;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 15px;
  }
  .copy-hint {
    font-size: 11px;
    color: #64748b;
  }
</style>
</head>
<body>

<h1>CaldTech Solutions - Selected Logo Gallery</h1>
<p>Showcasing your preferred Option 2 and Option 3 variations side-by-side.</p>

<div class="logo-gallery">

  <!-- OPTION 2: Grid & Wave Flow -->
  <div class="logo-card">
    <h3>Option 2: Grid & Wave Flow</h3>
    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 50" width="100%" height="auto">
        <style>
          .o2-main { font-family: Arial, sans-serif; font-weight: 900; font-size: 16px; fill: #1e293b; letter-spacing: 0.5px; }
          .o2-sub { font-family: Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #2563eb; }
        </style>
        <g transform="translate(2, 3)">
          <rect x="0" y="0" width="40" height="40" rx="8" fill="#0f172a" />
          <!-- Background Grid lines spanning open spaces -->
          <path d="M 0 10 L 40 10 M 0 20 L 40 20 M 0 30 L 40 30 M 10 0 L 10 40 M 20 0 L 20 40 M 30 0 L 30 40" stroke="#1e293b" stroke-width="1" />
          <!-- Sine Wave cutting across open area -->
          <path d="M 0 25 Q 10 5, 20 25 T 40 25" stroke="#25D366" stroke-width="2" fill="none" />
          <circle cx="20" cy="12" r="3" fill="#d97706" />
          <!-- Readable JJC Monogram -->
          <text x="5" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff">JJC</text>
        </g>
        <text x="50" y="20" class="o2-main">CaldTech Solutions</text>
        <text x="50" y="36" class="o2-sub">Data Pipeline &amp; Craft</text>
      </svg>
    </div>
    <span class="copy-hint">Structured Grid & Wave Network</span>
  </div>

  <!-- OPTION 3: Neon Pulse Core -->
  <div class="logo-card">
    <h3>Option 3: Neon Pulse Core</h3>
    <div class="svg-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 50" width="100%" height="auto">
        <style>
          .o3-main { font-family: Arial, sans-serif; font-weight: 900; font-size: 16px; fill: #1e293b; letter-spacing: 0.5px; }
          .o3-sub { font-family: Arial, sans-serif; font-weight: 600; font-size: 10px; fill: #16a34a; }
        </style>
        <g transform="translate(2, 3)">
          <rect x="0" y="0" width="40" height="40" rx="10" fill="#1e293b" />
          <!-- Pulse wave filling background open areas -->
          <path d="M 2 20 L 10 20 L 15 8 L 22 32 L 28 15 L 33 20 L 38 20" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.7" />
          <circle cx="22" cy="20" r="3.5" fill="#25D366" />
          <!-- Readable JJC Monogram -->
          <text x="5" y="27" font-family="Arial, sans-serif" font-weight="900" font-size="18" fill="#ffffff">JJC</text>
        </g>
        <text x="50" y="20" class="o3-main">CaldTech Solutions</text>
        <text x="50" y="36" class="o3-sub">Systems &amp; Automation</text>
      </svg>
    </div>
    <span class="copy-hint">Heartbeat Pulse & High Contrast</span>
  </div>

</div>

</body>
</html>
